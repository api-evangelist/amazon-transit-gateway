openapi: 3.2.0
info:
  title: Amazon Transit Gateway Route Tables API
  description: Amazon Transit Gateway connects VPCs and on-premises networks through a central hub. This API provides operations for creating and managing transit gateways, VPC attachments, route tables, peering connections, and multicast domains via the EC2 API.
  version: '2016-11-15'
  contact:
    name: Amazon Web Services
    url: https://aws.amazon.com/transit-gateway/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://aws.amazon.com/service-terms/
  x-logo:
    url: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
servers:
- url: https://ec2.{region}.amazonaws.com
  description: Amazon EC2 regional endpoint (Transit Gateway operations)
  variables:
    region:
      default: us-east-1
      description: AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-north-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-southeast-1
      - ap-southeast-2
      - ap-south-1
      - sa-east-1
      - ca-central-1
security:
- aws_sig_v4: []
tags:
- name: Route Tables
paths:
  /?Action=CreateTransitGatewayRouteTable:
    get:
      operationId: CreateTransitGatewayRouteTable
      summary: Amazon Transit Gateway Create a Transit Gateway Route Table
      description: Creates a route table for the specified transit gateway.
      tags:
      - Route Tables
      parameters:
      - name: Action
        in: query
        required: true
        schema:
          type: string
        example: example
      - name: TransitGatewayId
        in: query
        required: true
        schema:
          type: string
        example: example-id
      responses:
        '200':
          description: Successful response.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    aws_sig_v4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 authentication.
externalDocs:
  description: Amazon Transit Gateway API Reference
  url: https://docs.aws.amazon.com/AWSEC2/latest/APIReference/OperationList-query-tgw.html
